<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Taxi</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#0b1220;color:#e2e8f0}
#map{position:absolute;inset:0;z-index:1}
.hide{display:none!important}

/* Bienvenida */
#welcome{position:absolute;inset:0;z-index:3000;background:#0b1220;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px}
.card h1{font-size:28px;text-align:center}
.card p{color:#94a3b8;text-align:center;font-size:14px}
button,input{font:inherit}
button{border:0;border-radius:12px;padding:14px;font-weight:600;cursor:pointer;background:#16233c;color:#e2e8f0}
button:hover{background:#1e2f4d}
button.main{background:#facc15;color:#0b1220}
button.alt{background:#22c55e;color:#0b1220}
input{width:100%;padding:13px;border-radius:10px;border:1px solid #253552;background:#111c31;color:#e2e8f0}
input:focus{outline:2px solid #38bdf8}
.link{background:none;color:#94a3b8;padding:6px;font-weight:400}

/* Mapa */
.bar{position:absolute;z-index:1000;display:flex;gap:8px;top:calc(12px + env(safe-area-inset-top,0px));right:12px}
.bar button{padding:10px 14px;background:rgba(11,18,32,.92);border:1px solid #1e293b;box-shadow:0 4px 14px rgba(0,0,0,.4)}
#status{position:absolute;z-index:1000;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:420px;
  background:rgba(11,18,32,.95);border:1px solid #1e293b;border-radius:14px;padding:14px;box-shadow:0 8px 28px rgba(0,0,0,.5)}
#status b{color:#38bdf8}
#status small{color:#94a3b8;display:block;margin-top:4px}
.dot{display:block;width:20px;height:20px;border-radius:50%;background:var(--c);border:3px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.5)}
.dot.me{animation:p 1.8s infinite}
@keyframes p{0%{box-shadow:0 0 0 0 rgba(56,189,248,.8)}100%{box-shadow:0 0 0 18px rgba(56,189,248,0)}}
.leaflet-container{background:#dde3ea}
.pop b{font-size:14px}.pop div{margin-top:3px;font-size:13px}
.pop a{color:#2563eb;font-weight:600}
</style>
</head>
<body>

<div id="welcome">
  <div class="card" id="stepRole">
    <h1>🚕 Taxi</h1>
    <p>¿Cómo vas a usar la app?</p>
    <button class="alt" data-role="cliente">🙋 Soy cliente</button>
    <button class="main" data-role="taxista">🚕 Soy taxista</button>
  </div>
  <div class="card hide" id="stepForm">
    <h1 id="formTitle"></h1>
    <input id="fNombre" placeholder="Nombre" autocomplete="name">
    <input id="fTel" placeholder="Número de teléfono" type="tel" autocomplete="tel">
    <input id="fMat" placeholder="Matrícula" class="driver" autocapitalize="characters">
    <input id="fColor" placeholder="Color del vehículo" class="driver">
    <p id="err" class="hide" style="color:#f87171">No se pudo cargar el mapa. Revisa tu conexión e inténtalo de nuevo.</p>
    <button class="main" id="enter">Entrar</button>
    <button class="link" id="back">← Volver</button>
  </div>
</div>

<div id="map"></div>
<div class="bar hide" id="bar">
  <button id="fs" title="Pantalla completa">⛶</button>
  <button id="exit" title="Cambiar rol">Salir</button>
</div>
<div id="status" class="hide"></div>

<script>
const $ = id => document.getElementById(id);

/* ---------- Carga de Leaflet con CDN de respaldo ---------- */
const LEAFLET_CDNS = [
  ['https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css', 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js'],
  ['https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css', 'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js'],
  ['https://unpkg.com/leaflet@1.9.4/dist/leaflet.css', 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js']
];
function loadLeaflet(){
  return LEAFLET_CDNS.reduce((chain, [css, js]) => chain.catch(() => new Promise((resolve, reject) => {
    if (window.L) return resolve();
    const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = css; document.head.appendChild(l);
    const s = document.createElement('script'); s.src = js;
    s.onload = () => window.L ? resolve() : reject();
    s.onerror = reject;
    document.head.appendChild(s);
  })), Promise.reject());
}
const leafletReady = loadLeaflet();
function leafletFailed(){
  $('welcome').classList.remove('hide');
  $('stepRole').classList.add('hide');
  $('stepForm').classList.remove('hide');
  $('err').classList.remove('hide');
}
const CENTER = [23.1249, -82.3631];
const STALE_MS = 10000, PREFIX = 'tm:u:';
const store = {
  get(k){ try{ return JSON.parse(sessionStorage.getItem(k)); }catch(e){ return null; } },
  set(k,v){ try{ sessionStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};

let me = store.get('tm:me');
let myPos = null, watchId = null, map = null, myMarker = null, nearLine = null;
const markers = {};

/* ---------- Sincronización (localStorage entre pestañas del mismo navegador).
   Para uso real con varios dispositivos, reemplaza publish() y readAll()
   por tu backend (WebSocket, Firebase, Supabase...). ---------- */
function publish(){
  if (!me || !myPos) return;
  try{ localStorage.setItem(PREFIX + me.id, JSON.stringify({...me, lat:myPos.lat, lng:myPos.lng, ts:Date.now()})); }catch(e){}
}
function readAll(){
  const out = [];
  try{
    for (let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i);
      if (!k.startsWith(PREFIX)) continue;
      const u = JSON.parse(localStorage.getItem(k));
      if (Date.now() - u.ts > STALE_MS){ localStorage.removeItem(k); continue; }
      if (u.id !== me.id) out.push(u);
    }
  }catch(e){}
  return out;
}

/* ---------- Utilidades ---------- */
function dist(a, b){
  const r = Math.PI/180, dLa=(b.lat-a.lat)*r, dLn=(b.lng-a.lng)*r;
  const s = Math.sin(dLa/2)**2 + Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLn/2)**2;
  return 2*6371000*Math.asin(Math.sqrt(s));
}
const fmt = m => m < 1000 ? Math.round(m)+' m' : (m/1000).toFixed(2)+' km';
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon = (c, cls='') => L.divIcon({className:'', html:`<span class="dot ${cls}" style="--c:${c}"></span>`, iconSize:[20,20], iconAnchor:[10,10]});

/* ---------- Bienvenida ---------- */
let role = null;
document.querySelectorAll('[data-role]').forEach(b => b.onclick = () => {
  role = b.dataset.role;
  $('formTitle').textContent = role === 'taxista' ? 'Datos del taxista' : 'Datos del cliente';
  document.querySelectorAll('.driver').forEach(el => el.classList.toggle('hide', role !== 'taxista'));
  $('stepRole').classList.add('hide'); $('stepForm').classList.remove('hide');
});
$('back').onclick = () => { $('stepForm').classList.add('hide'); $('stepRole').classList.remove('hide'); };

$('enter').onclick = () => {
  const v = id => $(id).value.trim();
  const need = role === 'taxista' ? ['fNombre','fTel','fMat','fColor'] : ['fNombre','fTel'];
  const bad = need.find(id => !v(id));
  if (bad){ $(bad).focus(); return; }
  me = { id: 'u' + Math.random().toString(36).slice(2,9), role, nombre: v('fNombre'), tel: v('fTel') };
  if (role === 'taxista'){ me.matricula = v('fMat').toUpperCase(); me.color = v('fColor'); }
  store.set('tm:me', me);
  goFullscreen();
  leafletReady.then(start, leafletFailed);
};

/* ---------- Pantalla completa ---------- */
function goFullscreen(){
  const el = document.documentElement;
  if (!document.fullscreenElement && el.requestFullscreen) el.requestFullscreen().catch(()=>{});
}
$('fs').onclick = () => document.fullscreenElement ? document.exitFullscreen() : goFullscreen();
$('exit').onclick = () => {
  try{ localStorage.removeItem(PREFIX + me.id); }catch(e){}
  sessionStorage.removeItem('tm:me');
  if (document.fullscreenElement) document.exitFullscreen();
  location.reload();
};
window.addEventListener('pagehide', () => { try{ if (me) localStorage.removeItem(PREFIX + me.id); }catch(e){} });

/* ---------- App ---------- */
function start(){
  $('welcome').classList.add('hide');
  $('bar').classList.remove('hide');
  $('status').classList.remove('hide');

  if (!map){
    map = L.map('map').setView(CENTER, 15);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19, attribution: '&copy; OpenStreetMap'
    }).addTo(map);
    map.on('click', e => { if (!watchId || !hasGps) setPos(e.latlng); }); // sin GPS: toca el mapa para ubicarte
  }
  setTimeout(() => map.invalidateSize(), 100);

  if (navigator.geolocation){
    watchId = navigator.geolocation.watchPosition(
      p => { hasGps = true; const first = !myPos; setPos(L.latLng(p.coords.latitude, p.coords.longitude)); if (first) map.setView(myPos, 16); },
      () => { if (!myPos) status('Sin GPS. <b>Toca el mapa</b> para marcar tu posición.'); },
      { enableHighAccuracy:true, maximumAge:5000, timeout:15000 }
    );
  } else status('Sin GPS. <b>Toca el mapa</b> para marcar tu posición.');

  setInterval(() => { publish(); render(); }, 2000);
  window.addEventListener('storage', e => { if (e.key && e.key.startsWith(PREFIX)) render(); });
  render();
}
let hasGps = false;

function setPos(ll){
  myPos = ll;
  const c = me.role === 'taxista' ? '#facc15' : '#38bdf8';
  if (!myMarker) myMarker = L.marker(ll, {icon: icon(c,'me'), zIndexOffset:1000}).addTo(map).bindTooltip('Tú');
  else myMarker.setLatLng(ll);
  publish(); render();
}

function status(html){ $('status').innerHTML = html; }

function popup(u, d){
  const base = `<div class="pop"><b>${esc(u.nombre)}</b><div>📞 <a href="tel:${esc(u.tel)}">${esc(u.tel)}</a></div>`;
  const car = u.role === 'taxista' ? `<div>🚗 ${esc(u.matricula)} · ${esc(u.color)}</div>` : '';
  return base + car + (d != null ? `<div>📍 ${fmt(d)}</div>` : '') + '</div>';
}

function render(){
  if (!map || !me) return;
  const target = me.role === 'cliente' ? 'taxista' : 'cliente';
  const others = readAll().filter(u => u.role === target);
  const seen = new Set();

  others.forEach(u => {
    seen.add(u.id);
    const ll = L.latLng(u.lat, u.lng);
    const d = myPos ? dist(myPos, ll) : null;
    if (!markers[u.id]){
      markers[u.id] = L.marker(ll, {icon: icon(u.role === 'taxista' ? '#facc15' : '#22c55e')}).addTo(map).bindPopup('');
    }
    markers[u.id].setLatLng(ll).setPopupContent(popup(u, d));
  });
  Object.keys(markers).forEach(id => { if (!seen.has(id)){ map.removeLayer(markers[id]); delete markers[id]; } });

  if (nearLine){ map.removeLayer(nearLine); nearLine = null; }
  const label = me.role === 'cliente' ? 'Taxis disponibles' : 'Clientes esperando';
  if (!myPos) return status(`<b>${label}: ${others.length}</b><small>Esperando tu ubicación…</small>`);
  if (!others.length) return status(`<b>${label}: 0</b><small>Nadie conectado por ahora.</small>`);

  const sorted = others.map(u => ({u, d: dist(myPos, L.latLng(u.lat, u.lng))})).sort((a,b) => a.d - b.d);
  const n = sorted[0];
  nearLine = L.polyline([myPos, [n.u.lat, n.u.lng]], {color:'#2563eb', weight:4, dashArray:'10 6'}).addTo(map);
  const extra = n.u.role === 'taxista' ? ` · ${esc(n.u.matricula)} (${esc(n.u.color)})` : '';
  status(`<b>${label}: ${others.length}</b><small>Más cercano: ${esc(n.u.nombre)}${extra} · <b>${fmt(n.d)}</b></small>`);
}

/* Si ya había sesión en esta pestaña, entra directo */
if (me) leafletReady.then(start, leafletFailed);
</script>
</body>
</html>
